# ---------------------------------------------------------------------------
# Email warming configuration
#
# Copy to config.yaml and fill in. config.yaml and tokens/ are gitignored.
# ---------------------------------------------------------------------------

# OAuth client secrets downloaded from Google Cloud Console
# (APIs & Services -> Credentials -> OAuth client ID -> Desktop app).
credentials_file: credentials.json
token_dir: tokens

# Every mailbox in the warming pool. They send to and engage with each other.
# The domain you want to warm should be here; add 2-5 established mailboxes on
# other providers/domains you control to give it healthy peers to talk to.
accounts:
  - email: darren.small@midnyt.ai      # the domain being warmed
    name: Darren Small
  - email: youralt1@gmail.com
    name: Alex Rivera
  - email: youralt2@gmail.com
    name: Sam Carter
  # - email: youralt3@yourotherdomain.com
  #   name: Jordan Lee

# Volume ramp. Start tiny and grow slowly.
ramp:
  start_date: 2026-07-03   # day 0 of warming; do not change once started
  start_volume: 4          # total emails across the pool on day 0
  growth: 0.25             # +25% per day
  max_per_day: 40          # steady-state ceiling for the whole pool
  scan_days: 2             # look back this many days for unread warming mail

# Fraction of received warming emails that get a reply (builds two-way signal).
reply_rate: 0.35

# Random gap between sends, in seconds [min, max], so traffic isn't robotic.
send_gap_seconds: [30, 240]
