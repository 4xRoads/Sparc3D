<!--
  Midnyt progress update — Resend email template.
  Placeholders filled at send time: {{cadence}} {{title}} {{date}} {{stats_row}} {{content}}
  Email-client-safe: table layout, inline styles, web-safe fonts, 600px width.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0e0e12;margin:0;padding:24px 0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;background:#16161d;border-radius:14px;overflow:hidden;border:1px solid #26263200;">
        <!-- Header -->
        <tr>
          <td style="padding:28px 32px 22px 32px;background:linear-gradient(180deg,#1b1b24,#16161d);border-bottom:1px solid #262632;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#8b8ba7;font-weight:600;">
                  Midnyt &middot; {{cadence}} update
                </td>
                <td align="right" style="font-size:13px;color:#6c6c85;">{{date}}</td>
              </tr>
            </table>
            <div style="margin-top:12px;font-size:22px;line-height:1.3;color:#f4f4f8;font-weight:700;">
              {{title}}
            </div>
          </td>
        </tr>
        <!-- Stats strip -->
        <tr>
          <td style="padding:0 32px;">
            {{stats_row}}
          </td>
        </tr>
        <!-- Body -->
        <tr>
          <td style="padding:22px 32px 30px 32px;color:#c9c9d6;font-size:15px;line-height:1.62;">
            {{content}}
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td style="padding:18px 32px 26px 32px;border-top:1px solid #262632;color:#5f5f78;font-size:12px;line-height:1.6;">
            Automated by the Midnyt progress bot from <span style="color:#8b8ba7;">4xRoads/midnyt-pipeline</span> git activity.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
